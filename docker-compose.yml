version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: samesky-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-samesky_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - samesky-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samesky-backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-samesky_db}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    ports:
      - '3001:3001'
    volumes:
      - ./backend/src:/app/src
    networks:
      - samesky-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samesky-frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3001}
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
    networks:
      - samesky-network
    command: npm start

volumes:
  postgres_data:

networks:
  samesky-network:
    driver: bridge
